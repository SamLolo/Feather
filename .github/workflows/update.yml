name: Update | Pipeline

on:
  workflow_dispatch:

jobs:

  parse-modpacks:
    name: Parse modpacks to a list
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      modpack-folders: ${{ steps.list-modpacks.outputs.modpack-folders }}
    
    steps:

      - name: Check Out Git Repository
        uses: actions/checkout@v4

      - name: List Modpacks
        id: list-modpacks
        run: |
          modpackFolders=()
          while IFS= read -r -d '' folder; do
            if [ -e "$folder/pack.toml" ]; then
              modpackFolders+=("$folder")
            fi
          done < <(find client/ -type d -print0)
            
          echo "modpack-folders=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${modpackFolders[@]}")" >> "$GITHUB_OUTPUT"
  
      - name: Print detected modpacks
        run: |
          echo "::notice ::⚙ Detected modpacks: ${{ steps.list-modpacks.outputs.modpack-folders }}"


  update_mods:
    name: Update Mods
    runs-on: ubuntu-latest

    needs:
      - parse-modpacks
  
    if: ${{ (needs.parse-modpacks.outputs.modpack-folders) != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        modpack: ${{ fromJson(needs.parse-modpacks.outputs.modpack-folders) }}

    defaults:
      run:
        working-directory: ${{ matrix.modpack }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@V27

      - name: Update Mods with Packwiz
        run: nix develop --command packwiz update -a -y

      - name: Push the updated mod list via a Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
            commit-message: "update(${{ matrix.modpack }}): updated mods"
            title: 'update(${{ matrix.modpack }}): updated mods'
            body: >
              This PR is auto-generated by 
              [create-pull-request](https://github.com/peter-evans/create-pull-request).
