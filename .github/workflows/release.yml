name: Github Release
run-name: Release v${{ inputs.version }} for MC ${{ inputs.mc-version }} (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Modpack Version'
        required: true
        type: string
      mc-version:
        description: 'Minecraft Version'
        required: true
        type: string
      type:
        description: 'Release Type'
        required: false
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha


jobs:

  get-modpacks:
    name: Parse modpacks to a list
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      curseforge-packs: ${{ steps.list-curse.outputs.modpack-folders }}
      modrinth-packs: ${{ steps.list-modrinth.outputs.modpack-folders }}
    
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: List Curseforge Modpacks
        id: list-curse
        run: |
          modpackFolders=()
          while IFS= read -r -d '' folder; do
            if [ -e "$folder/pack.toml" ]; then
              modpackFolders+=("$folder")
            fi
          done < <(find curseforge/ -type d -print0)
            
          echo "modpack-folders=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${modpackFolders[@]}")" >> "$GITHUB_OUTPUT"
        
      - name: List Modrinth Modpacks
        id: list-modrinth
        run: |
          modpackFolders=()
          while IFS= read -r -d '' folder; do
            if [ -e "$folder/pack.toml" ]; then
              modpackFolders+=("$folder")
            fi
          done < <(find modrinth/ -type d -print0)
            
          echo "modpack-folders=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${modpackFolders[@]}")" >> "$GITHUB_OUTPUT"
  
      - name: Print Detected Modpacks
        run: |
          echo "::notice:: Detected modpacks: \n   Curseforge: ${{ steps.list-curse.outputs.modpack-folders }}\n   Modrinth: ${{ steps.list-modrinth.outputs.modpack-folders }}"

  
  create-release:
    name: Create a new draft release
    runs-on: ubuntu-latest

    needs:
      - get-modpacks

    if: ${{ (needs.get-modpacks.outputs.modrinth-packs) != '[]' && (needs.get-modpacks.outputs.curseforge-packs) != '[]'}}

    permissions:
      contents: write

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Draft Release
        run: |
          gh release create v${{ inputs.version }} \
            --draft \
            --title "Version ${{ inputs.version }} for MC ${{ inputs.mc-version }}" \
            --fail-on-no-commits \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set As Pre-Release
        if: ${{ inputs.type }} != 'release'
        run: |
          gh release edit v${{ inputs.version }} \
            --prerelease \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Changelog
        id: git-cliff
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: -u --tag v${{ inputs.version }} --strip header
        env:
          OUTPUT: docs/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Add Notes
        run: |
          gh release edit v${{ inputs.version }} \
            --notes ${{ steps.git-cliff.outputs.content }} \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-curseforge:
    name: Build files for Curseforge
    runs-on: ubuntu-latest

    needs:
      - get-modpacks
      - create-release
  
    if: ${{ (needs.get-modpacks.outputs.curseforge-packs) != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        modpack: ${{ fromJson(needs.get-modpacks.outputs.curseforge-packs) }}

    permissions:
      contents: write

    steps:

      - name: Parse Pack File
        id: parse
        uses: ./.github/actions/parse-pack
        with:
          directory: ${{ matrix.modpack }}

      - name: Build Modpack
        uses: ./.github/actions/build
        with:
          directory: ${{ matrix.modpack }}
          version: ${{ inputs.version }}
          loader: ${{ steps.parse.outputs.loader }}
          mc-version: ${{ inputs.mc-version }}
          type: ${{ inputs.type }}
          build-curseforge: 'true'


  build-modrinth:
    name: Build files for Modrinth
    runs-on: ubuntu-latest

    needs:
      - get-modpacks
      - create-release
  
    if: ${{ (needs.get-modpacks.outputs.modrinth-packs) != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        modpack: ${{ fromJson(needs.get-modpacks.outputs.modrinth-packs) }}

    permissions:
      contents: write

    steps:

      - name: Parse Pack File
        id: parse
        uses: ./.github/actions/parse-pack
        with:
          directory: ${{ matrix.modpack }}

      - name: Build Modpack
        uses: ./.github/actions/build
        with:
          directory: ${{ matrix.modpack }}
          version: ${{ inputs.version }}
          loader: ${{ steps.parse.outputs.loader }}
          mc-version: ${{ inputs.mc-version }}
          type: ${{ inputs.type }}
          build-modrinth: 'true'
