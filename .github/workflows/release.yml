name: Modpack Release
run-name: Modpack Release by @${{ github.actor }}

on:
  pull_request:
    types:
      - closed


env:
  pack-file: 'pack.toml'
  default-release-modrinth: 'true'
  default-release-curseforge: 'true'


jobs:

  verify-pr:
    name: Verify Pull Request
    runs-on: ubuntu-latest
    
    steps:

    - name: Check PR merged into main
      if: ${{ github.event.pull_request.merged != true }}
      uses: actions/github-script@v6
      with:
        script: |
            core.setFailed('PR not merged!')
    
    - name: Check PR had release label
      if: ${{ contains(github.event.pull_request.labels.*.name, 'release') != true }}
      uses: actions/github-script@v6
      with:
        script: |
            core.setFailed('PR missing release label!')


  set-vendors:
    name: Setup workflow environment
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      curseforge: ${{ steps.set-vendors.outputs.curseforge }}
      modrinth: ${{ steps.set-vendors.outputs.modrinth }}
    
    steps:

      - name: Check Out Git Repository
        uses: actions/checkout@v4
        
      
      - name: Set Mod Vendors
        id: set-vendors
        run: |
          [[ ! -z "${{ secrets.CURSEFORGE_TOKEN }}" && ! -z "${{ secrets.CURSEFORGE_ID }}" ]] && echo "curseforge=true" >> $GITHUB_OUTPUT || echo "curseforge=false" >> $GITHUB_OUTPUT
          [[ ! -z "${{ secrets.MODRINTH_TOKEN }}" && ! -z "${{ secrets.MODRINTH_ID }}" ]] && echo "modrinth=true" >> $GITHUB_OUTPUT || echo "modrinth=false" >> $GITHUB_OUTPUT
        shell: bash


  get-modpacks:
    name: Parse modpacks to a list
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      modpack-folders: ${{ steps.list-modpacks.outputs.modpack-folders }}
    
    steps:

      - name: Check Out Git Repository
        uses: actions/checkout@v4

      - name: List Modpacks
        id: list-modpacks
        run: |
          modpackFolders=()
          while IFS= read -r -d '' folder; do
            if [ -e "$folder/pack.toml" ]; then
              modpackFolders+=("$folder")
            fi
          done < <(find client/ -type d -print0)
            
          echo "modpack-folders=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${modpackFolders[@]}")" >> "$GITHUB_OUTPUT"
  
      - name: Print detected modpacks
        run: |
          echo "::notice:: Detected modpacks: ${{ steps.list-modpacks.outputs.modpack-folders }}"

  
  release-please:
    name: Handle Releases
    runs-on: ubuntu-latest

    needs:
      - set-vendors
      - get-modpacks
  
    if: ${{ (needs.get-modpacks.outputs.modpack-folders) != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        modpack: ${{ fromJson(needs.get-modpacks.outputs.modpack-folders) }}

    defaults:
      run:
        working-directory: ${{ matrix.modpack }}

    permissions:
      contents: write
      pull-requests: write


    steps:      

      - name: Check Out Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Parse Pack File
        id: parse-pack
        uses: ./.github/actions/parse
        with:
          directory: ${{ matrix.modpack }}
