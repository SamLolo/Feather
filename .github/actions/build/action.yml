name: 'Build & Release Modpack'
description: 'Uses packwiz to build the modpack and creates a github release.'

inputs:
  directory:
    description: "Path to the modpack directory"
    required: true
  version:
    description: "The modpack version"
    required: true
  loader:
    description: "The modpack loader for the current pack. Used to rename the pack."
    required: true
  mc-version:
    description: "The minecraft version the current pack is being built for."
    required: true
  release-tag:
    description: "The release tag for the current file under Github releases"
    required: true
  
  build-modrinth: 
    description: "Whether or not to build the modpack if it's a Modrinth release"
    required: false
    default: 'false'
  build-curse:
    description: "Whether or not to build the modpack if it's a Curseforge release"
    required: false
    default: 'false'
  

runs:
  using: "composite"
  
  steps:

    - name: Check Out Git Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: 'main'


    - name: Build Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        check-latest: true
      run: go version


    - name: Build Packwiz
      run: go install github.com/packwiz/packwiz@latest
      shell: bash


    - name: Move to Modpack Directory
      run: cd ${{ inputs.directory }}


    - name: Build Modrinth Modpack
      if: ${{ inputs.build-modrinth == 'true' }}
      run: |
        packwiz modrinth export
        mv Feather-${{ inputs.version }}.mrpack Feather-${{ inputs.loader }}-${{ inputs.mc-version }}-${{ inputs.version }}.mrpack
        echo "Modrinth pack '${{ inputs.directory }}' has been exported as 'Feather-${{ inputs.loader }}-${{ inputs.mc-version }}-${{ inputs.version }}.mrpack'"
      shell: bash
      working-directory: ${{ inputs.directory }}


    - name: Upload Modrinth Modpack to GitHub Releases
      if: ${{ inputs.build-modrinth == 'true' }}
      run: |
        gh release upload ${{ inputs.release-tag }} *.mrpack --clobber
        echo "Modpack ${{ inputs.directory }} has been uploaded to GitHub Releases"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      working-directory: ${{ inputs.directory }}


    - name: Build Curseforge Modpack
      if: ${{ inputs.build-curse == 'true' }}
      run: |
        packwiz curseforge export
        mv Feather-${{ inputs.version }}.zip Feather-${{ inputs.loader }}-${{ inputs.mc-version }}-${{ inputs.version }}.zip
        echo "Curseforge pack '${{ inputs.directory }}' has been exported as 'Feather-${{ inputs.loader }}-${{ inputs.mc-version }}-${{ inputs.version }}.zip'"
      shell: bash
      working-directory: ${{ inputs.directory }}


    - name: Upload Curseforge Modpack to GitHub Releases
      if: ${{ inputs.build-curse == 'true' }}
      run: |
        gh release upload ${{ inputs.release-tag }} *.zip --clobber
        echo "Modpack ${{ inputs.directory }} has been uploaded to GitHub Releases"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      working-directory: ${{ inputs.directory }}
