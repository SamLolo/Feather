name: 'Release Modpack | Action'
description: 'This automatically downloads the newest release and description and uploads it to vendors!'

inputs:
  loader:
    description: "Current Modpack Loader"
    required: true
  mc-version:
    description: "Current Modpack Minecraft Version"
    required: true
  release-tag:
    description: "Tag for the release (alpha, beta, release)"
    required: true
  version:
    description: "Version of the current Modpack"
    required: true

  upload-modrinth:
    description: "Should the Modpack Be Uploaded to Modrinth"
    required: true
  upload-curse:
    description: "Should the Modpack Be Uploaded to CurseForge"
    required: true


  MODRINTH_TOKEN:
    required: false
    description: "Token used to uploading modpack to Modrinth"
  MODRINTH_ID:
    required: false
    description: "ID used to uploading modpack to Modrinth"
  CURSEFORGE_TOKEN:
    required: false
    description: "Token used to uploading modpack to Curseforge"
  CURSEFORGE_ID:
    required: false
    description: "ID used to uploading modpack to Curseforge"


runs:
    using: "composite"
    steps:

      - name: Check Out Git Repository
        uses: actions/checkout@v4


      - name: Download the pack files
        uses: robinraju/release-downloader@v1.8
        id: download-files
        with:
          fileName: "*"
          tag: ${{ inputs.release-tag }}
          tarBall: false
          zipBall: false


      - name: Get latest release description
        uses: cardinalby/git-get-release-action@v1
        id: latest-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ inputs.release-tag }}


      - name: Pipe latest release description to file
        run: echo "${{ steps.latest-release.outputs.body }}" > CHANGELOG.release.md
        shell: bash


      - name: Print status
        run: |
          echo "Assets from latest release ${{ steps.latest-release.outputs.tag_name }} downloaded successfully!"
          echo "Latest release ${{ steps.latest-release.outputs.tag_name }} description piped into a file successfully!"
        shell: bash
        

      - name: Publish to Modrinth
        id: modrinth
        if: inputs.upload-modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ inputs.MODRINTH_ID }}
          modrinth-token: ${{ inputs.MODRINTH_TOKEN }}
          loaders: ${{ env.loader }}
          game-versions: ${{ env.mc-version }}
          changelog-file: CHANGELOG.release.*
          files: "*.mrpack"
          version: ${{ inputs.version }}
          version-type: ${{ inputs.release-tag }}


      - name: Print Modrinth upload status
        if: steps.modrinth.outcome == 'success'
        run: |
          echo "Modpack has been uploaded to Modrinth with ${{ inputs.MODRINTH_ID }}"
        shell: bash


      - name: Publish to CurseForge
        id: curseforge
        if: inputs.upload-curse == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ inputs.CURSEFORGE_ID }}
          curseforge-token: ${{ inputs.CURSEFORGE_TOKEN }}
          loaders: ${{ env.loader }}
          game-versions: ${{ env.mc-version }}
          changelog-file: CHANGELOG.release.*
          files: "*.zip"
          version: ${{ inputs.version }}
          version-type: ${{ inputs.release-tag }}


      - name: Print Curseforge upload status
        if: steps.curseforge.outcome == 'success'
        run: |
          echo "Modpack has been uploaded to Curseforge with ${{ inputs.CURSEFORGE_ID }}"
        shell: bash

